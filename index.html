<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bintang &amp; Rozak — Undangan Pernikahan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap">
<style>
:root{--bg:#070605;--gold:#d4af37;--gold2:#f1d98a;--ink:#efe6d2;--mute:#a89c82;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;overflow-x:hidden}
body.lock{overflow:hidden}
#spacer{height:1080vh}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7))}
p{line-height:1.7;font-size:.9rem}
.small{font-size:.78rem;color:var(--mute);letter-spacing:.08em}
.amp{font-family:var(--serif);font-style:italic;font-size:1.8rem;color:var(--gold)}
.btn{display:inline-block;margin:.5rem .35rem 0;padding:.9em 1.8em;border:1px solid var(--gold);color:var(--gold2);background:rgba(7,6,5,.65);font:400 .74rem var(--sans);letter-spacing:.14em;text-decoration:none;cursor:pointer;transition:background .3s,color .3s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:#120e04;outline:none}
#auto{position:fixed;top:3vh;right:4vw;z-index:4;margin:0;padding:.7em 1.2em;font-size:.68rem}
#hint{position:fixed;bottom:5vh;left:0;right:0;text-align:center;z-index:3;transition:opacity .6s;pointer-events:none}
#rsvpBox,#rekBox{position:fixed;left:0;right:0;bottom:6vh;z-index:3;text-align:center;padding:0 6vw;opacity:0;pointer-events:none}
.cd{display:flex;gap:.7rem;justify-content:center;margin-bottom:1rem}
.cd div{min-width:62px;padding:.6rem .4rem;border:1px solid rgba(212,175,55,.4);background:rgba(7,6,5,.65)}
.cd span{display:block;font:600 1.6rem var(--serif);color:var(--gold2)}
.cd small{font-size:.6rem;color:var(--mute);letter-spacing:.1em}
#cover{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 35%,#1b1508,#070605 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;transition:opacity 1.2s ease,visibility 1.2s}
#cover.off{opacity:0;visibility:hidden}
#cover h1{font:400 clamp(2.8rem,9vw,5.6rem)/1.05 var(--serif);color:var(--gold2)}
#cover .to{margin:2rem 0 .4rem}
#cover .to b{display:block;font:400 1.4rem var(--serif);color:var(--gold2);margin-top:.3rem}
</style>
</head>
<body class="lock">
<div id="cover">
  <p class="small">The Wedding of</p>
  <h1>Bintang<br><span class="amp">&amp;</span><br>Rozak</h1>
  <div class="to"><p class="small">Kepada Yth.</p><b id="guest">Tamu Undangan</b></div>

</div>
<div id="rekBox"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ====== UBAH DATA ACARA DI SINI ====== */
const CONFIG={
  tanggal:"2027-01-01T10:00:00",
  tanggalTeks:"Sabtu, 1 Januari 2027",
  jam:"10.00 WIB sampai selesai",
  tempat:"Nama Gedung / Lokasi",

  wa:"6281234567890",
  ortuPutri:"Putri dari Bapak [Nama] &amp; Ibu [Nama]",
  ortuPutra:"Putra dari Bapak [Nama] &amp; Ibu [Nama]",
  // foto: sementara pakai foto gratis Unsplash (3 pertama foto pasangan sebagai pengganti). Ganti dengan "foto/1.jpg", dst. kalau sudah punya foto sendiri.
  foto:[
    "https://images.unsplash.com/photo-1595407753234-0882f1e77954?auto=format&fit=crop&w=1400&q=75",
    "https://images.unsplash.com/photo-1606490208247-b65be3d94cd1?auto=format&fit=crop&w=1400&q=75",
    "https://images.unsplash.com/photo-1519741414274-5b1ee71137fa?auto=format&fit=crop&w=1400&q=75",
    "https://images.unsplash.com/photo-1669128453417-dbda0a00e4d9?auto=format&fit=crop&w=1400&q=75",
    "https://images.unsplash.com/photo-1605101417781-b069480f938a?auto=format&fit=crop&w=1400&q=75",
    "https://images.unsplash.com/photo-1501046791521-e24baf06e55b?auto=format&fit=crop&w=1400&q=75"
  ],

    {tahun:"20XX",judul:"Mulai dekat",teks:"Tulis momen ketika kalian mulai saling mengenal."},
    {tahun:"20XX",judul:"Lamaran",teks:"Tulis cerita singkat tentang hari lamaran."},
    {tahun:"2027",judul:"Hari bahagia",teks:"Dan kini kami siap melangkah bersama."}

  rekening:[

  ]

const $=id=>document.getElementById(id);
const NARROW=innerWidth<820,pk=(a,b)=>NARROW?b:a,KF=NARROW?1.7:1;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),ease=w=>w*w*(3-2*w);
const guest=new URLSearchParams(location.search).get('to')||'Tamu Undangan';
$('guest').textContent=guest;$('maps').href=CONFIG.maps;
$('rsvp').href='https://wa.me/'+CONFIG.wa+'?text='+encodeURIComponent('Halo, saya '+guest+' ingin konfirmasi kehadiran di pernikahan Bintang & Rozak.');
function tickCd(){const t=Math.max(0,new Date(CONFIG.tanggal)-new Date())/1000;
  $('d').textContent=Math.floor(t/86400);$('h').textContent=Math.floor(t%86400/3600);$('m').textContent=Math.floor(t%3600/60);$('s').textContent=Math.floor(t%60)}
tickCd();setInterval(tickCd,1000);
$('open').onclick=()=>{$('cover').classList.add('off');document.body.classList.remove('lock');musicOn()};
addEventListener('resize',()=>{if((innerWidth<820)!==NARROW)location.reload()});

const RB=$('rekBox');
RB.innerHTML=CONFIG.rekening.map((r,i)=>'<button class="btn" data-i="'+i+'">SALIN NO. REKENING '+r.bank.toUpperCase()+'</button>').join('');
RB.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const no=String(CONFIG.rekening[+b.dataset.i].noRek),label=b.textContent;
  const done=()=>{b.textContent='TERSALIN ✓';setTimeout(()=>{b.textContent=label},1600)};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=no;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();done()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(no).then(done,fb);else fb();
};

/* musik latar: file mp3 dari CONFIG.musik, atau instrumental bawaan (dibuat langsung di browser) */
let mOn=false,mEl=null,AC=null,mGain=null,mTimer=null,nextT=0,step=0;
if(CONFIG.musik){mEl=new Audio(CONFIG.musik);mEl.loop=true;mEl.volume=.6;mEl.preload='auto';
  mEl.addEventListener('error',()=>{mEl=null;if(mOn)synthOn()})}
let scW=null,scReady=false,scPlaying=false,scUse=!CONFIG.musik&&!!CONFIG.soundcloud;
function scFail(){if(!scUse)return;scUse=false;if(mOn)synthOn()}
if(scUse){
  const fr=document.createElement('iframe');
  fr.allow='autoplay';fr.tabIndex=-1;fr.setAttribute('aria-hidden','true');fr.title='Musik latar';
  fr.style.cssText='position:fixed;width:2px;height:2px;left:0;bottom:0;opacity:0;pointer-events:none;border:0';
  fr.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(CONFIG.soundcloud)+'&auto_play=false&visual=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false';
  document.body.appendChild(fr);
  const sc=document.createElement('script');sc.src='https://w.soundcloud.com/player/api.js';
  sc.onload=()=>{try{
    scW=SC.Widget(fr);
    scW.bind(SC.Widget.Events.READY,()=>{if(!scUse)return;scReady=true;scW.setVolume(60);if(mOn)scW.play()});
    scW.bind(SC.Widget.Events.PLAY,()=>{if(!scUse){scW.pause();return}scPlaying=true});
    scW.bind(SC.Widget.Events.FINISH,()=>{scW.seekTo(0);scW.play()});
    scW.bind(SC.Widget.Events.ERROR,scFail);
  }catch(_){scFail()}};
  sc.onerror=scFail;
  document.head.appendChild(sc);
  setTimeout(()=>{if(!scReady)scFail()},8000);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const CH=[{b:36,p:[60,64,67,72]},{b:43,p:[59,62,67,71]},{b:45,p:[60,64,69,72]},{b:41,p:[60,65,69,72]}];
const PAT=[[0,1,2,3,2,1,2,1],[0,2,1,3,2,3,1,2]],SP=.42;
function voice(f,t,d,v,type,a){a=a||.02;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mGain);o.start(t);o.stop(t+d+.05)}
function sched(){
  while(nextT<AC.currentTime+.6){
    const bar=Math.floor(step/8),i=step%8,ch=CH[bar%4],pat=PAT[Math.floor(bar/4)%2];
    if(i===0){voice(NOTE(ch.b),nextT,SP*8,.2,'sine',.05);ch.p.forEach(n=>voice(NOTE(n-12),nextT,SP*8,.04,'triangle',.6))}
    voice(NOTE(ch.p[pat[i]]),nextT,SP*3.4,.08,'triangle');
    nextT+=SP;step++;
  }
}
function synthOn(quiet){
  const AX=window.AudioContext||window.webkitAudioContext;if(!AX)return;
  if(!AC){
    AC=new AX();mGain=AC.createGain();mGain.gain.value=0;
    const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();
    dl.delayTime.value=.42;fb.gain.value=.35;lp.type='lowpass';lp.frequency.value=2200;
    mGain.connect(AC.destination);mGain.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AC.destination);
    nextT=AC.currentTime+.1;mTimer=setInterval(sched,100);
  }
  AC.resume();if(quiet)return;mGain.gain.cancelScheduledValues(AC.currentTime);mGain.gain.setValueAtTime(mGain.gain.value,AC.currentTime);mGain.gain.linearRampToValueAtTime(.7,AC.currentTime+1.5);
}
function musicOn(){
  mOn=true;
  if(mEl)mEl.play().catch(()=>{if(mEl&&mEl.error)return;mOn=false});
  else if(scUse){synthOn(true);if(scReady)scW.play();setTimeout(()=>{if(scUse&&!scPlaying)scFail()},4500)}
  else synthOn();
}
document.addEventListener('visibilitychange',()=>{if(!mOn)return;
  const w=scUse&&scReady?scW:null;
  if(document.hidden){mEl?mEl.pause():w?w.pause():AC&&AC.suspend()}else{mEl?mEl.play().catch(()=>{}):w?w.play():AC&&AC.resume()}});

/* gulir otomatis: tekan tombol untuk memutar, sentuh atau gulir sendiri untuk menghentikan */
const AUTO_SECONDS=150;
let auto=false,apos=0,alast=0;
const ab=$('auto');
function setAuto(on){auto=on;ab.textContent=on?'❚❚ JEDA':'▶ OTOMATIS';ab.setAttribute('aria-pressed',on);if(on){apos=scrollY;alast=performance.now()}}
ab.onclick=()=>{
  if(auto){setAuto(false);return}
  const max=document.documentElement.scrollHeight-innerHeight;
  if(scrollY>=max-4){scrollTo(0,0);apos=0}
  setAuto(true);
};
['wheel','touchstart','keydown'].forEach(ev=>addEventListener(ev,e=>{if(auto&&!(e.target.closest&&e.target.closest('#auto')))setAuto(false)},{passive:true}));
(function autoTick(now){
  if(auto){
    const max=document.documentElement.scrollHeight-innerHeight,dt=Math.min(.1,(now-alast)/1000);alast=now;
    apos=Math.min(max,apos+max/AUTO_SECONDS*dt);scrollTo(0,apos);
    if(apos>=max)setAuto(false);
  }
  requestAnimationFrame(autoTick);
})(performance.now());

function sil(n){
  const flip=n%2?' transform="translate(400 0) scale(-1 1)"':'';
  const g=[['#f1d98a','#b8923a'],['#e9b7a0','#8a3b4a'],['#f6e7b4','#a67c00']][n%3];
  const vb=n%3===2?'60 70 290 362':'0 0 400 500';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="'+vb+'" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="'+g[0]+'" stop-opacity=".95"/><stop offset=".55" stop-color="'+g[1]+'" stop-opacity=".55"/><stop offset="1" stop-color="#0a0807"/></radialGradient></defs><rect width="400" height="500" fill="url(#g)"/>'
  +'<g fill="#fff6d8" opacity=".7"><circle cx="70" cy="90" r="2"/><circle cx="330" cy="120" r="1.6"/><circle cx="110" cy="260" r="1.4"/><circle cx="350" cy="300" r="2"/><circle cx="55" cy="380" r="1.5"/></g>'
  +'<g'+flip+' fill="#0a0807"><circle cx="160" cy="150" r="24"/><rect x="152" y="170" width="16" height="16"/><path d="M120 195Q160 180 200 195L204 300H116Z"/><path d="M116 200L104 310L118 312L128 215Z"/><path d="M200 200L216 300L202 303L192 215Z"/><path d="M122 298H158L156 432H128Z"/><path d="M162 298H198L192 432H160Z"/>'
  +'<circle cx="250" cy="158" r="21"/><circle cx="263" cy="140" r="10"/><rect x="243" y="177" width="14" height="14"/><path d="M226 198Q250 188 274 198L268 268H232Z"/><path d="M232 266C225 340 205 395 188 432H352C322 380 292 330 268 266Z"/><path d="M230 205L212 262L224 267L240 214Z"/><circle cx="257" cy="270" r="13" fill="'+g[0]+'"/></g>'
  +'<rect y="432" width="400" height="68" fill="#0a0807"/></svg>';
  return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}

/* ====== SCENE 3D ====== */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x070605);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x070605,.036);
const camera=new THREE.PerspectiveCamera(45,1,.1,200);scene.add(camera);
const camLight=new THREE.PointLight(0xffe2b0,1.1,14);camera.add(camLight);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?70:45;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const aniso=renderer.capabilities.getMaxAnisotropy();

const ec=document.createElement('canvas');ec.width=512;ec.height=256;
const g2=ec.getContext('2d'),gr=g2.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#2a2113');gr.addColorStop(.5,'#0d0a06');gr.addColorStop(1,'#000');
g2.fillStyle=gr;g2.fillRect(0,0,512,256);g2.fillStyle='#fff3cf';[[40,40,90,24],[240,70,120,16],[400,30,70,40],[150,150,60,10]].forEach(r=>g2.fillRect(...r));
const env=new THREE.PMREMGenerator(renderer).fromEquirectangular(new THREE.CanvasTexture(ec)).texture;
scene.add(new THREE.AmbientLight(0xffffff,.3));
const dl=new THREE.DirectionalLight(0xffe2a8,1.2);dl.position.set(3,4,5);scene.add(dl);

const M=(o)=>new THREE.MeshStandardMaterial(Object.assign({envMap:env},o));
const gold=M({color:0xd4af37,metalness:1,roughness:.2,envMapIntensity:1.5});
const champagne=M({color:0xe9cfa4,metalness:.75,roughness:.32,envMapIntensity:1.3,side:THREE.DoubleSide});
const rose=M({color:0xc99a74,metalness:.75,roughness:.35,envMapIntensity:1.3,side:THREE.DoubleSide});
const wine=new THREE.MeshPhysicalMaterial({color:0x7a1230,metalness:.35,roughness:.22,clearcoat:1,clearcoatRoughness:.1,envMap:env,envMapIntensity:1.2});
const gem=M({color:0xffffff,metalness:.1,roughness:0,flatShading:true,envMapIntensity:2.5});

function makeRing(){const g=new THREE.Group();
  const a=new THREE.Mesh(new THREE.TorusGeometry(1,.14,32,120),gold);a.position.x=-.6;
  const b=new THREE.Mesh(new THREE.TorusGeometry(1,.12,32,120),gold);b.rotation.x=Math.PI/2;b.position.x=.8;
  const d=new THREE.Mesh(new THREE.OctahedronGeometry(.24),gem);d.position.set(-.6,1.16,0);d.scale.y=1.3;g.add(a,b,d);return g}
function makeFlower(){const o=new THREE.Group(),f=new THREE.Group();o.add(f);o.rotation.x=1.05;o.userData.inner=f;
  const sph=new THREE.SphereGeometry(1,28,18);
  [[8,1.35,1,0,champagne],[8,.95,.85,Math.PI/8,rose],[6,.55,.65,0,champagne]].forEach(([n,tilt,len,off,mat])=>{
    for(let i=0;i<n;i++){const py=new THREE.Group();py.rotation.y=off+i*Math.PI*2/n;const px=new THREE.Group();px.rotation.x=tilt;
      const p=new THREE.Mesh(sph,mat);p.scale.set(.34*len,.95*len,.09);p.position.y=.95*len;px.add(p);py.add(px);f.add(py)}});
  f.add(new THREE.Mesh(new THREE.SphereGeometry(.24,24,16),gold));
  for(let i=0;i<12;i++){const a=i*Math.PI/6,s=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8),gold);s.position.set(Math.cos(a)*.32,.22,Math.sin(a)*.32);f.add(s)}
  return o}
function makeHeart(){const hs=new THREE.Shape();
  hs.moveTo(0,-1.1);hs.bezierCurveTo(-.2,-.8,-1.3,-.2,-1.3,.4);hs.bezierCurveTo(-1.3,1,-.5,1.3,0,.7);hs.bezierCurveTo(.5,1.3,1.3,1,1.3,.4);hs.bezierCurveTo(1.3,-.2,.2,-.8,0,-1.1);
  const hg=new THREE.ExtrudeGeometry(hs,{depth:.45,bevelEnabled:true,bevelThickness:.16,bevelSize:.14,bevelSegments:8,curveSegments:48});hg.center();
  const g=new THREE.Group();g.add(new THREE.Mesh(hg,wine));const halo=new THREE.Mesh(new THREE.TorusGeometry(1.75,.018,12,140),gold);g.add(halo);g.userData.halo=halo;return g}

/* bintang kecil berkilau (bukan kotak) */
const starTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,246,216,1)');g.addColorStop(.25,'rgba(241,217,138,.5)');g.addColorStop(1,'rgba(241,217,138,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);x.fillStyle='rgba(255,246,216,.95)';x.beginPath();
  [[32,2],[36,28],[62,32],[36,36],[32,62],[28,36],[2,32],[28,28]].forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
  x.closePath();x.fill();return new THREE.CanvasTexture(c)})();

/* tulisan judul 3D (huruf bertumpuk) */
const LAYERS=14,STEP=.0045;
function title(lines,w){
  const F=200,LH=1.14,fam='"Cormorant Garamond",Georgia,serif';
  const m=document.createElement('canvas').getContext('2d');m.font='600 '+F+'px '+fam;
  const mw=Math.max(...lines.map(l=>m.measureText(l).width)),fs=Math.min(F,F*1500/mw),pad=fs*.18;
  const cw=Math.ceil(mw*fs/F+pad*2),ch=Math.ceil(lines.length*fs*LH+pad*2);
  const draw=fill=>{const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
    x.font='600 '+fs+'px '+fam;x.textAlign='center';x.textBaseline='middle';x.fillStyle=fill(x,ch);
    lines.forEach((l,i)=>x.fillText(l,cw/2,pad+fs*LH*(i+.5)));const t=new THREE.CanvasTexture(c);t.anisotropy=aniso;return t};
  const side=draw(()=>'#fff'),front=draw((x,h)=>{const g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#fff4c4');g.addColorStop(.42,'#e2b93f');g.addColorStop(.58,'#a67c00');g.addColorStop(1,'#f6dd8e');return g});
  const geo=new THREE.PlaneGeometry(1,ch/cw),grp=new THREE.Group(),dark=new THREE.Color(0x120d03),mid=new THREE.Color(0x8c6a14);
  for(let i=LAYERS;i>=0;i--){

/* tulisan biasa di dalam scene */
function text(items,w){
  const CW=1024,PAD=28,rows=[],c=document.createElement('canvas'),x=c.getContext('2d');c.width=CW;
  items.forEach(it=>{
    const fs=Math.round((it.fs||34)*KF),fam=it.serif?'"Cormorant Garamond",Georgia,serif':'Montserrat,system-ui,sans-serif',font=(it.serif?600:300)+' '+fs+'px '+fam;
    x.font=font;let line='',first=true;
    const push=s=>{rows.push({s,font,fs,c:it.c,g:first?(it.gap||0):0});first=false};
    String(it.t).replace(/&amp;/g,'&').split(' ').forEach(wd=>{const tt=line?line+' '+wd:wd;
      if(line&&x.measureText(tt).width>CW-2*PAD){push(line);line=wd}else line=tt});
    push(line)});
  const H=Math.ceil(rows.reduce((a,r)=>a+r.fs*1.32+r.g,PAD*2));c.height=H;x.textAlign='center';x.textBaseline='top';
  let y=PAD;rows.forEach(r=>{y+=r.g;x.font=r.font;x.fillStyle=r.c||'#efe6d2';x.fillText(r.s,CW/2,y);y+=r.fs*1.32});
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=aniso;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,w*H/CW),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}))}

let ready=false,cur=0,camP,camL,fo=0,cr=0,lt=0;
const NS=14,rsvpBox=$('rsvpBox'),hint=$('hint'),V=(a)=>new THREE.Vector3(a[0],a[1],a[2]);
function frame(ms){
  const t=ms*.001,max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
  const x=clamp(scrollY/max,0,1)*NS,fl=Math.min(NS-1,Math.floor(x)),target=fl+ease(clamp((x-fl-.28)/.44,0,1));
  cur+=(target-cur)*.08;
  const u=cur/NS,p=camP.getPoint(u),l=camL.getPoint(u);
  camera.position.set(p.x+Math.sin(t*.4)*.06,p.y+Math.cos(t*.3)*.04,p.z);camera.lookAt(l);
  spin.forEach(f=>f(t));
  floaters.forEach(f=>{f.g.position.y=f.y+Math.sin(t*.8+f.ph)*.05;f.g.rotation.y=f.ry+Math.sin(t*.5+f.ph)*.04});

  // buka amplop berbasis waktu (cepat), mulai begitu kamera mendekat, tidak menunggu panjang gulir

  e.flap.rotation.x=-Math.PI*o;e.flap.position.z=.08-.12*ease(clamp((o-.5)/.5,0,1));

  RB.style.opacity=clamp(1-Math.abs(cur-13)*2.4,0,1);RB.style.pointerEvents=RB.style.opacity>.5?'auto':'none';

}
